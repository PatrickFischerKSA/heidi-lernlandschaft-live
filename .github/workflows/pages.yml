name: Heidi-Lernlandschaft veröffentlichen
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Feedback prüfen
        run: |
          node research/feedback.test.cjs
          node research/filmography.test.cjs
          node research/cases.test.cjs
      - name: Vollständige Originalquelle ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern Heidiundmehr.pdf --dir dist/quellen
      - name: Vollständigen Realfilm ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download realfilm-2015 --repo "$GITHUB_REPOSITORY" --pattern heidi-2015-realfilm.mp4 --dir dist/media
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
